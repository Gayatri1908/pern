[project]
name = "thesource-backend"
version = "0.1.0"
description = "The Source Company — Industrial IoT Renewable Energy Management Platform API"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.14.0,<2.0",

    # Settings & validation
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "email-validator>=2.0.0,<3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.0.0,<5.0",
    "pyotp>=2.9.0,<3.0",

    # Redis
    "redis[hiredis]>=5.0.0,<6.0",

    # MQTT
    "aiomqtt>=2.0.0,<3.0",

    # Logging
    "structlog>=24.1.0,<25.0",

    # HTTP client (for Google OAuth, weather API, etc.)
    "httpx>=0.27.0,<1.0",

    # Background jobs
    "arq>=0.26.0,<1.0",

    # File handling
    "python-multipart>=0.0.9,<1.0",

    # Utilities
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
